stages:
  - build

variables:
  CMAKE_GENERATOR: Ninja

# CoreRealtime: target unico aarch64-unknown-linux-gnu
build:ubuntu:arm64:
  stage: build
  image: "ubuntu:24.04"
  artifacts:
    paths:
      - build/corerealtime
    expire_in: 1 week
  before_script:
    - apt-get update
    - apt-get install -y build-essential cmake ninja-build git crossbuild-essential-arm64 libmbedtls-dev
  script:
    - cmake -B build --toolchain cmake/toolchain-aarch64-ubuntu-unknown.cmake -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
