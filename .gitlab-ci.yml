stages:
  - build

variables:
  CMAKE_GENERATOR: Ninja

# CoreRealtime: target unico x86_64-unknown-linux-gnu
build:ubuntu:amd64:
  stage: build
  image: "ubuntu:24.04"
  artifacts:
    paths:
      - build/corerealtime
    expire_in: 1 week
  before_script:
    - apt-get update
    - apt-get install -y build-essential cmake ninja-build git libmbedtls-dev
  script:
    - cmake -B build --toolchain cmake/toolchain-x86_64-linux-gnu.cmake -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
